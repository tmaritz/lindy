name: update

on:
  schedule:
    - cron: "0 6 * * *"     # daily, 06:00 UTC
  workflow_dispatch: {}      # manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 lindy.py --limit 80 --min-score 20

      - name: Commit if changed
        run: |
          git config user.name  "lindy-bot"
          git config user.email "lindy-bot@users.noreply.github.com"
          git add LINDY.md index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh list ($(date -u +%F))" \
                     -m "Regenerated by the scheduled workflow run."
          git push
